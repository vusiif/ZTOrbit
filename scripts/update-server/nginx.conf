# Used by z2-updater.service through its read-only /srv/z2-updater bind mount.
daemon off;
worker_processes 1;
pid /run/z2-updater/nginx.pid;
error_log stderr warn;

events {
    worker_connections 512;
}

http {
    types {
        application/json json;
        application/zip zip;
        text/plain sig pub txt;
    }
    default_type application/octet-stream;
    access_log /var/log/z2-updater/access.log combined;
    server_tokens off;
    sendfile on;
    gzip off;
    autoindex off;
    keepalive_timeout 15s;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    client_max_body_size 1k;
    client_body_temp_path /run/z2-updater/client-body;
    proxy_temp_path /run/z2-updater/proxy;
    fastcgi_temp_path /run/z2-updater/fastcgi;
    uwsgi_temp_path /run/z2-updater/uwsgi;
    scgi_temp_path /run/z2-updater/scgi;

    map $arg_version $release_version {
        default "";
        "~^0\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$" $arg_version;
    }

    server {
        listen 10.10.10.1:18102;
        server_name 10.10.10.1;
        root /srv/z2-updater/www;
        add_header X-Content-Type-Options nosniff always;

        location = /healthz {
            default_type text/plain;
            return 200 "Z2Updater ready\n";
        }

        # Defines /updater with one immutable JSON file and its matching
        # X-Z2-Signature header. Nginx reload switches both together.
        include /srv/z2-updater/conf/active-release.conf;

        location = /file {
            limit_except GET HEAD { deny all; }
            include /srv/z2-updater/conf/active-file.conf;
            if ($release_version = "") { return 404; }
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options nosniff always;
            default_type application/zip;
            try_files /z2/releases/windows-x64/$release_version/Z2-$release_version-windows-x64.zip =404;
        }

        location / { return 404; }
    }
}
